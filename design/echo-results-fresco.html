<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo · Resultado de sesi&oacute;n</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --teal: #1A7A6B; --teal-hover: #156A5D; --teal-dim: #2A9A8B;
  --amber: #E8B84A; --amber-hover: #D0A030;
  --bg: #FAFAFA; --surface: #FFFFFF; --surface-elevated: #F5F5F5;
  --fg: #0E1412; --muted: #5A7268; --border: #D0E8E0; --border-light: #E8F5F0;
  --glow: rgba(232,184,74,0.25);
  --radius-sm: 0.75rem; --radius-md: 1rem; --radius-lg: 1.5rem; --radius-xl: 2rem;
  --font-display: 'Outfit', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --ease-out: cubic-bezier(0.16,1,0.3,1);
  --ease-spring: cubic-bezier(0.32,0.72,0,1);
  --hi: #2E8A5A; --mid: #C4A040; --lo: #C84A5A;
}
[data-theme="dark"] {
  --teal: #7AC8B8; --teal-hover: #8AD8C8; --teal-dim: #5AAAA0;
  --amber: #F0D080; --amber-hover: #E0C060;
  --bg: #0E1412; --surface: #182220; --surface-elevated: #1E2A25;
  --fg: #E0F0EA; --muted: #90B0A8; --border: #2A4840; --border-light: #1E3830;
  --glow: rgba(240,208,128,0.20);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --teal: #7AC8B8; --teal-hover: #8AD8C8; --teal-dim: #5AAAA0;
    --amber: #F0D080; --amber-hover: #E0C060;
    --bg: #0E1412; --surface: #182220; --surface-elevated: #1E2A25;
    --fg: #E0F0EA; --muted: #90B0A8; --border: #2A4840; --border-light: #1E3830;
    --glow: rgba(240,208,128,0.20);
  }
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-body);background:var(--bg);color:var(--fg);
  line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden
}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:var(--radius-sm)}
.btn-primary:focus-visible,.btn-ghost:focus-visible{border-radius:999px}
.theme-toggle:focus-visible{border-radius:50%}

.skip-nav{
  position:absolute;top:-100%;left:0;z-index:1000;
  background:var(--teal);color:#fff;padding:.5rem 1rem;font-weight:600;
  border-radius:0 0 var(--radius-sm) 0;transition:top 150ms var(--ease-out)
}
.skip-nav:focus{top:0}

.topbar-wrap{
  position:sticky;top:0;z-index:50;padding:1rem 1.5rem 0;
  display:flex;justify-content:center;pointer-events:none
}
.topbar{
  pointer-events:auto;
  display:flex;align-items:center;justify-content:space-between;gap:.75rem;
  min-height:52px;padding:0 1rem 0 1.5rem;
  background:rgba(255,255,255,0.88);backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(208,232,224,0.25);
  border-radius:999px;box-shadow:0 4px 24px rgba(0,0,0,0.06);
  max-width:680px;width:100%;
  transition:box-shadow 300ms var(--ease-out);
  animation:nav-in 600ms var(--ease-spring) both
}
[data-theme="dark"] .topbar{
  background:rgba(24,34,32,0.88);border-color:rgba(42,72,64,0.25)
}
@keyframes nav-in{from{opacity:0;transform:translateY(-16px) scale(.96)}}
.wordmark{
  font-family:var(--font-display);font-size:1.05rem;font-weight:700;
  letter-spacing:.08em;color:var(--teal);text-decoration:none
}
.topbar-left{display:flex;align-items:center;gap:1.25rem;min-width:0}
.topbar-nav{display:none;gap:.15rem}
@media(min-width:640px){.topbar-nav{display:flex}}
.topbar-nav a{
  padding:.4rem .8rem;border-radius:999px;font-size:.8125rem;font-weight:500;
  color:var(--muted);text-decoration:none;white-space:nowrap;
  transition:background 150ms var(--ease-out),color 150ms var(--ease-out)
}
.topbar-nav a:hover{background:var(--surface-elevated);color:var(--fg)}
.topbar-nav a[aria-current="page"]{background:var(--teal);color:#fff}
.topbar-right{display:flex;align-items:center;gap:.5rem;flex:none}
.theme-toggle{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--border-light);
  background:transparent;cursor:pointer;color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  transition:background 150ms var(--ease-out),color 150ms var(--ease-out);
  font-size:1rem
}
.theme-toggle:hover{background:var(--surface-elevated);color:var(--fg)}

main{max-width:640px;margin:0 auto;padding:2rem 1.5rem 5rem}
@media(max-width:768px){main{padding:1.5rem 1rem 4rem}}
.page{display:flex;flex-direction:column;gap:1.75rem}
.page>*{animation:fade-up 700ms var(--ease-spring) both}
.page>:nth-child(1){animation-delay:0s}
.page>:nth-child(2){animation-delay:.08s}
.page>:nth-child(3){animation-delay:.16s}
.page>:nth-child(4){animation-delay:.24s}
.page>:nth-child(5){animation-delay:.32s}
@keyframes fade-up{from{opacity:0;transform:translateY(20px)}}

.session-meta{
  font-family:var(--font-mono);font-size:.7rem;letter-spacing:.04em;color:var(--muted);text-align:center
}

/* ---------- Score Card (double bezel) ---------- */
.doppel{
  padding:2px;border-radius:var(--radius-xl);
  background:linear-gradient(135deg,var(--border),var(--border-light),var(--border));
  box-shadow:0 8px 40px rgba(26,122,107,0.12)
}
.doppel__inner{
  background:var(--surface);border-radius:calc(var(--radius-xl) - 2px);
  padding:2.25rem;display:flex;flex-direction:column;align-items:center;gap:1rem;
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.15)
}
@media(max-width:768px){.doppel__inner{padding:1.75rem}}

.ring-wrap{position:relative;width:140px;height:140px}
.ring-wrap svg{transform:rotate(-90deg);display:block}
.ring-bg{stroke:var(--border-light)}
.ring-fill{stroke:var(--teal);stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 1.2s var(--ease-spring)}
.ring-fill.anim{stroke-dashoffset:61.1}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num{font-family:var(--font-display);font-weight:700;font-size:2rem;letter-spacing:-.01em;color:var(--fg)}
.ring-grade{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}

.target-sent{
  display:flex;align-items:center;gap:.5rem;padding:.75rem 1rem;
  background:var(--surface-elevated);border-radius:var(--radius-md);width:100%;
  font-size:.9375rem;font-weight:500;color:var(--fg)
}
.target-sent svg{width:16px;height:16px;color:var(--teal);flex:none}

/* ---------- Mini Stats ---------- */
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
.mini-stat{
  text-align:center;padding:.9rem .5rem;background:var(--surface);border-radius:var(--radius-md);
  border:1px solid var(--border-light)
}
.mini-stat__num{font-family:var(--font-display);font-weight:700;font-size:1.5rem;letter-spacing:-.01em;color:var(--fg)}
.mini-stat__label{font-size:.7rem;color:var(--muted);margin-top:.15rem;letter-spacing:.02em}

/* ---------- Word Breakdown ---------- */
.breakdown-card{
  background:var(--surface);border-radius:var(--radius-md);border:1px solid var(--border-light);padding:1.5rem
}
.breakdown-card h2{
  font-family:var(--font-display);font-size:1.0625rem;font-weight:600;color:var(--fg);margin-bottom:1rem
}
.word-pills{display:flex;flex-wrap:wrap;gap:.5rem}
.word-pill{
  padding:.45rem .85rem;border-radius:var(--radius-sm);font-size:.875rem;font-weight:500;
  background:var(--surface-elevated)
}
.word-pill.hi{color:var(--hi);border-bottom:2px solid var(--hi)}
.word-pill.mid{color:var(--mid);border-bottom:2px solid var(--mid)}
.word-pill.lo{color:var(--lo);border-bottom:2px solid var(--lo)}

/* ---------- Actions ---------- */
.actions{display:flex;gap:.75rem}
.btn-primary{
  flex:1;display:flex;align-items:center;justify-content:center;gap:.55rem;
  padding:.9rem 1.5rem;min-height:52px;border:none;border-radius:999px;cursor:pointer;
  background:var(--teal);color:#fff;font-family:var(--font-body);font-weight:600;font-size:.9375rem;
  text-decoration:none;box-shadow:0 6px 24px rgba(26,122,107,0.28);
  transition:transform 300ms var(--ease-spring),box-shadow 300ms var(--ease-spring)
}
.btn-primary:hover{transform:translateY(-2px)}
.btn-primary svg{width:17px;height:17px}
.btn-ghost{
  display:flex;align-items:center;justify-content:center;gap:.55rem;
  padding:.9rem 1.25rem;min-height:52px;border-radius:999px;cursor:pointer;
  background:transparent;border:1px solid var(--border-light);color:var(--muted);
  font-family:var(--font-body);font-weight:500;font-size:.9375rem;text-decoration:none;
  transition:background 150ms var(--ease-out),color 150ms var(--ease-out)
}
.btn-ghost:hover{background:var(--surface-elevated);color:var(--fg)}
.btn-ghost svg{width:17px;height:17px}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .ring-fill{stroke-dashoffset:61.1!important}
}
</style>
</head>
<body>
<a class="skip-nav" href="#main">Saltar al contenido</a>

<div class="topbar-wrap">
  <header class="topbar">
    <div class="topbar-left">
      <a class="wordmark" href="echo-home-fresco.html">ECHO</a>
      <nav class="topbar-nav" aria-label="Navegaci&oacute;n principal">
        <a href="echo-home-fresco.html">Inicio</a>
        <a href="echo-practice-fresco.html">Practicar</a>
        <a href="echo-progress-fresco.html">Progreso</a>
      </nav>
    </div>
    <div class="topbar-right">
      <button class="theme-toggle" data-theme-btn aria-label="Cambiar tema">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>
</div>

<main id="main">
<div class="page">

  <p class="session-meta">Sesi&oacute;n completa &middot; hoy, 14:20</p>

  <section class="doppel" aria-label="Puntaje de la sesi&oacute;n">
    <div class="doppel__inner">
      <div class="ring-wrap">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="ring-bg" cx="70" cy="70" r="54" fill="none" stroke-width="8"/>
          <circle class="ring-fill" id="score-ring" cx="70" cy="70" r="54" fill="none" stroke-width="8"/>
        </svg>
        <div class="ring-center">
          <span class="ring-num">82%</span>
          <span class="ring-grade">Notable</span>
        </div>
      </div>
      <div class="target-sent">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        I would like a cup of coffee, please.
      </div>
    </div>
  </section>

  <div class="mini-stats">
    <div class="mini-stat">
      <div class="mini-stat__num">9</div>
      <div class="mini-stat__label">palabras</div>
    </div>
    <div class="mini-stat">
      <div class="mini-stat__num">7</div>
      <div class="mini-stat__label">correctas</div>
    </div>
    <div class="mini-stat">
      <div class="mini-stat__num">2</div>
      <div class="mini-stat__label">marcadas</div>
    </div>
  </div>

  <section class="breakdown-card" aria-label="Desglose por palabra">
    <h2>Desglose por palabra</h2>
    <div class="word-pills">
      <span class="word-pill hi">I</span>
      <span class="word-pill hi">would</span>
      <span class="word-pill mid">like</span>
      <span class="word-pill hi">a</span>
      <span class="word-pill hi">cup</span>
      <span class="word-pill lo">of</span>
      <span class="word-pill hi">coffee,</span>
      <span class="word-pill mid">please.</span>
    </div>
  </section>

  <div class="actions">
    <a class="btn-primary" href="echo-practice-fresco.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      Practicar de nuevo
    </a>
    <a class="btn-ghost" href="echo-home-fresco.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-7 9 7"/><path d="M5 9v10h14V9"/></svg>
      Inicio
    </a>
  </div>

</div>
</main>

<script>
(function () {
  'use strict';
  var themeBtn = document.querySelector('[data-theme-btn]');
  var savedTheme = 'system';
  try { savedTheme = localStorage.getItem('echo-theme') || 'system'; } catch (e) {}
  function applyTheme(choice) {
    if (choice === 'system') { document.documentElement.removeAttribute('data-theme'); }
    else { document.documentElement.setAttribute('data-theme', choice); }
    try { localStorage.setItem('echo-theme', choice); } catch (e) {}
  }
  applyTheme(savedTheme);
  themeBtn.addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') || 'system';
    var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var isLight = cur === 'light' || (cur === 'system' && !isDark);
    applyTheme(isLight ? 'dark' : 'light');
  });

  setTimeout(function () {
    var ring = document.getElementById('score-ring');
    if (ring) ring.classList.add('anim');
  }, 300);
})();
</script>
</body>
</html>
