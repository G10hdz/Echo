# Cloud Build → Cloud Run deployment
# Trigger: push to main branch (configured in GCP Console)
# Manual: gcloud builds submit --config=cloudbuild.yaml

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/echo-backend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/echo-backend:latest'
      - '.'
    timeout: '1200s'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/echo-backend']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'echo-backend'
      - '--image=gcr.io/$PROJECT_ID/echo-backend:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--port=8080'
      - '--allow-unauthenticated'
      - '--set-env-vars=^||^WHISPER_MODEL_SIZE=base||ECHO_CORS_ORIGINS=https://echo-pronunciation.netlify.app,http://localhost:5173'
      - '--set-secrets=ELEVENLABS_API_KEY=echo-elevenlabs-key:latest'

images:
  - 'gcr.io/$PROJECT_ID/echo-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/echo-backend:latest'