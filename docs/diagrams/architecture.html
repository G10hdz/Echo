<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo — architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      margin-bottom: 0.4rem;
    }
    .sub { color: var(--color-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Echo — pronunciation practice</h1>
    <p class="sub">Record against a native reference, compare waveforms, score per phoneme. React SPA on Netlify; ElevenLabs supplies the reference voice.</p>

    <svg viewBox="0 0 1100 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ech-title ech-desc">
      <title id="ech-title">Echo: practice loop</title>
      <desc id="ech-desc">The user records a sentence with the Web Audio API; the app renders their waveform against a native-speaker reference (ElevenLabs TTS), scores phoneme by phoneme, and stores session history and streaks for the Progress screen. Deployed as a static SPA on Netlify.</desc>
      <defs>
        <marker id="ech-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="ech-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="1100" height="460" fill="#f5f5f5"/>

      <!-- external -->
      <rect x="40" y="60" width="200" height="64" rx="6" fill="rgba(79,93,117,0.06)" stroke="#7a8399" stroke-width="1"/>
      <text x="140" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ElevenLabs</text>
      <text x="140" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">native reference TTS</text>

      <rect x="40" y="150" width="200" height="60" rx="6" fill="rgba(79,93,117,0.06)" stroke="#7a8399" stroke-width="1"/>
      <text x="140" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mic — Web Audio</text>
      <text x="140" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">user recording</text>

      <!-- SPA -->
      <rect x="300" y="40" width="460" height="270" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="530" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FRONTEND/ — REACT 18 + VITE SPA</text>

      <rect x="320" y="90" width="200" height="60" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="420" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Practice screen</text>
      <text x="420" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">record · compare · score</text>

      <rect x="320" y="170" width="200" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="194" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Waveform compare</text>
      <text x="420" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">user vs native · visual</text>

      <rect x="320" y="250" width="200" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phoneme breakdown</text>
      <text x="420" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">correct / partial / missed</text>

      <rect x="560" y="90" width="180" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="650" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Progress</text>
      <text x="650" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">history · streaks · Recharts</text>

      <rect x="560" y="170" width="180" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="650" y="194" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Settings</text>
      <text x="650" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lang · level · voice · theme</text>

      <rect x="560" y="250" width="180" height="50" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.32)" stroke-width="0.8"/>
      <text x="650" y="270" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Clinical Sublime</text>
      <text x="650" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">design tokens · dark mode</text>

      <!-- deploy -->
      <rect x="820" y="90" width="230" height="60" rx="6" fill="rgba(79,93,117,0.06)" stroke="#7a8399" stroke-width="1"/>
      <text x="935" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Netlify — static SPA</text>
      <text x="935" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">echo-pronunciation.netlify.app</text>

      <!-- design dir -->
      <rect x="820" y="170" width="230" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.32)" stroke-width="0.8"/>
      <text x="935" y="194" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">design/ — home, onboarding,</text>
      <text x="935" y="210" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">results (designed, pending impl)</text>
      <text x="935" y="226" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">html mocks + brand-spec</text>

      <!-- edges -->
      <path d="M 240 92 L 270 92 Q 280 92 280 102 L 280 112 Q 280 120 290 120 L 320 120" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ech-arrow)"/>
      <path d="M 240 180 L 320 180" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#ech-arrow-accent)"/>
      <path d="M 420 150 L 420 170" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ech-arrow)"/>
      <path d="M 420 230 L 420 250" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ech-arrow)"/>
      <path d="M 520 200 L 560 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ech-arrow)"/>
      <path d="M 520 128 L 560 128" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ech-arrow)"/>
      <path d="M 760 110 L 820 118" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ech-arrow)"/>

      <!-- langs strip -->
      <rect x="40" y="330" width="1030" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.32)" stroke-width="0.8"/>
      <text x="555" y="354" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EN + ES live · Mandarin planned · audio pipeline reused by ai-coach (Echo-derived recorder)</text>
      <text x="555" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">infra/pop-codex — deploy scripts · frontend Dockerfile</text>
    </svg>
  </div>
</body>
</html>
